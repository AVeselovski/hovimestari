# Local development only. The database for `pnpm db:up`.
# Trust authentication: no password exists, and the port is bound to this
# machine only, so nothing outside it can connect.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hovimestari
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hovimestari_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hovimestari_db:
