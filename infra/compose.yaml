name: hovimestari

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hovimestari}
    ports:
      - "${POSTGRES_PORT:-5001}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-hovimestari}
      API_PORT: ${API_PORT:-3000}
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-}
      HOVI_FORCE_PROVIDER: ${HOVI_FORCE_PROVIDER:-}
    ports:
      - "${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-/api}
      VITE_API_PROXY_TARGET: http://api:3000
      HOST_HOSTNAME: ${HOST_HOSTNAME:-}
      HOST_LAN_IP: ${HOST_LAN_IP:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../apps/web:/repo/apps/web
      - ../packages/shared:/repo/packages/shared
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
    depends_on:
      - api

volumes:
  pgdata:
    name: hovimestari_pgdata
